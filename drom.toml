[project]
drom-version = "0.9.3"
share-repo = "https://github.com/OCamlPro/drom-share"
share-version = "0.9.3"

[project]
authors = ["Fabrice Le Fessant <fabrice.le_fessant@ocamlpro.com>"]
ci-systems = ["ubuntu-latest", "macos-latest", "windows-latest"]
copyright = "OCamlPro SAS"
edition = "4.14.2"
github-organization = "ocamlpro"
license = "LGPL2"
min-edition = "4.11.0"
name = "ez_file"
skeleton = "program"
synopsis = "Easy file manipulation (read_file, write_file, etc.)"
version = "0.4.1"

# keys that you could also define:
# odoc-target = "...odoc-target..."
# sphinx-target = "...sphinx-target..."
# archive = "...archive..."
# dev-repo = "...dev-repo..."
# bug-reports = "...bug-reports..."
# doc-api = "...doc-api..."
# doc-gen = "...doc-gen..."
# homepage = "...homepage..."

[project]
description = """
This library provides some modules to read and write files, and create 
and scan directories.
"""

[project]
skip = ["src/ez_file/main.ml", "CHANGES.md",
        "test/expect-tests/test.ml",
        "test/inline-tests/dune", "test/inline-tests/dune.drom",
        "test/inline-tests/test.ml",
        "test/output-tests/dune", "test/output-tests/dune.drom",
        "test/output-tests/test1.expected",
        "test/output-tests/test2.ml",
        "test/output-tests/test2.expected"]

# project-wide library dependencies (not for package-specific deps)
[dependencies]

# project-wide tools dependencies (not for package-specific deps)
[tools]
dune = "2.8"
[tools.odoc]
for-doc = true
[tools.ppx_expect]
for-test = true

[project]

# dirs to skip while scanning for dune files
skip-dirs = []

# dirs to scan for share/ folders (with package names)
share-dirs = ["share"]

# build profile to use by default
# build-profile = ...

# Profile options for this project
#    [profile]
#    dev = { ocaml-flags = "-w +a-4-40-41-42-44" }
#    release = { ocaml-flags = "-w -a" }
[profile]
# ...

# project-wide fields (depends on project skeleton)
# examples:
#  docker-alpine-image = "ocamlpro/ocaml:4.13"
#  dune-lang = "2.1"
#  readme-trailer = "..."
#  dot-gitignore-trailer = "..."
[fields]
dune-lang = "2.8.0"
# ...

[[package]]
dir = "src/ez_file"
# edit 'src/ez_file/package.toml' for package-specific options

